name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: talentrank
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d talentrank"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/talentrank
      TALENTRANK_APP_URL: https://talentrank.example.test
      TALENTRANK_AUTH_SECRET: 7zQ4nW9pL2sX8cV5bN1mK6rT3yH0aDqF
      TALENTRANK_STORAGE_KEY: Lp82Qr57Nm14Xs93Vt60Ha31Kc49Wd26
      TALENTRANK_MALWARE_SCAN_URL: https://scanner.example.test/scan
      TALENTRANK_EMAIL_PROVIDER: webhook
      TALENTRANK_EMAIL_FROM: TalentRank AI <noreply@example.test>
      TALENTRANK_EMAIL_WEBHOOK_URL: https://email.example.test/send
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy:check
      - run: NODE_ENV=production TALENTRANK_USE_PRISMA=true npm run deploy:check
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm test
      - run: npm run build
      - run: npx prisma db push
      - run: npm run test:product
        env:
          QA_USE_PRISMA: "true"
      - run: npm audit --omit=dev --omit=optional --audit-level=moderate
